name: 'Build'

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
    paths-ignore:
      - '**/*.md'
      - '**/*.aip'
      - '.vscode/**'
      - '**/*.json'
      - 'setup/**'
  pull_request:
    branches:
      - master

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Offset chosen to stay well above the last AppVeyor build counter (3.3.1251.0) at time of migration.
  BUILD_VERSION_OFFSET: 2000
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_NOLOGO: 'true'
  SCPLIB_ENABLE_TELEMETRY: 'false'
  # Files cache is always enabled (see Configure vcpkg binary cache). The GitHub Packages NuGet
  # provider is appended only when VCPKG_NUGET_TOKEN is present. GITHUB_TOKEN cannot push new
  # packages under a personal-account GitHub Packages namespace, so a PAT with
  # read:packages/write:packages is required. See:
  # https://github.com/microsoft/vcpkg/issues/47470
  VCPKG_BINARY_SOURCES: 'clear'

jobs:
  version:
    name: 'Resolve version'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      is-release: ${{ steps.resolve.outputs.is-release }}
      tag: ${{ steps.resolve.outputs.tag }}
      setup-version: ${{ steps.resolve.outputs.setup-version }}
      driver-version: ${{ steps.resolve.outputs.driver-version }}
      revision: ${{ steps.resolve.outputs.revision }}
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            build

      - name: 'Resolve driver and setup versions'
        id: resolve
        shell: pwsh
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          $ErrorActionPreference = 'Stop'
          . ./build/ReleaseVersion.ps1
          $version = ConvertTo-DsHidMiniReleaseVersion `
            -Ref $env:RELEASE_REF `
            -RunNumber ${{ github.run_number }} `
            -BuildVersionOffset ([int]$env:BUILD_VERSION_OFFSET)
          Write-DsHidMiniReleaseVersionOutputs -Version $version -GitHubOutput $env:GITHUB_OUTPUT
          Write-Output "is-release=$($version.IsRelease) tag=$($version.Tag) setup=$($version.SetupVersion) driver=$($version.DriverVersion)"

  build:
    name: 'Platform: ${{ matrix.platform }}'
    needs: version
    # VS 2026 / MSBuild 18 is required by .NET SDK 10.0.2xx+ (windows-2022 is MSBuild 17.14).
    runs-on: windows-2025-vs2026
    permissions:
      contents: read
    env:
      BUILD_VERSION: ${{ needs.version.outputs.driver-version }}
      # Secrets can't be referenced directly in `if:` conditions, only in `env:`/`with:`,
      # so promote it here and check env.VCPKG_NUGET_TOKEN in the step below instead.
      VCPKG_NUGET_TOKEN: ${{ secrets.VCPKG_NUGET_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64, x86]
    outputs:
      build-version: ${{ needs.version.outputs.driver-version }}
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true
          persist-credentials: false

      - name: 'Setup .NET'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: 'Bootstrap vcpkg'
        shell: cmd
        run: .\XInputBridge\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: 'Resolve cache keys'
        id: cache-keys
        shell: pwsh
        run: |
          # ImageVersion is a runner process env var, not an Actions `env:` context value,
          # so capture it here for the cache keys (invalidates on toolchain image upgrades).
          $dmfSha = git rev-parse HEAD:DMF
          $vcpkgSha = git rev-parse HEAD:XInputBridge/vcpkg
          $imageVersion = $env:ImageVersion
          echo "dmf-sha=$dmfSha" >> $env:GITHUB_OUTPUT
          echo "vcpkg-sha=$vcpkgSha" >> $env:GITHUB_OUTPUT
          echo "image-version=$imageVersion" >> $env:GITHUB_OUTPUT
          Write-Output "DMF $dmfSha / vcpkg $vcpkgSha (ImageVersion=$imageVersion)"

      # windows-2025-vs2026 ships a WDK VS extension and SDK 26100, but not the
      # WDK headers/libs (ntifs.h, UMDF). See runner-images#14263. x64/ARM64
      # restore the 28000 WDK+SDK NuGet packages instead of running the MSI
      # installers. x86 does not build the driver or DMF and uses the image SDK.
      - name: 'Setup NuGet'
        if: matrix.platform != 'x86'
        uses: NuGet/setup-nuget@v2

      - name: 'Cache WDK NuGet packages'
        if: matrix.platform != 'x86'
        id: wdk-nuget
        uses: actions/cache@v6
        with:
          path: packages
          key: wdk-nuget-v1-${{ hashFiles('build/wdk-packages.config') }}-${{ steps.cache-keys.outputs.image-version }}

      - name: 'Restore WDK NuGet packages'
        if: matrix.platform != 'x86' && steps.wdk-nuget.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # nuget.exe only accepts the filename packages.config
          $config = Join-Path $env:RUNNER_TEMP 'packages.config'
          Copy-Item -LiteralPath 'build\wdk-packages.config' -Destination $config -Force
          nuget restore $config -PackagesDirectory packages -NonInteractive

      - name: 'Cache NuGet packages'
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          # Explicit project list so DMF submodule csproj churn does not evict the cache.
          key: nuget-${{ runner.os }}-${{ hashFiles('ControlApp/ControlApp.csproj', 'ControlApp.Tests/ControlApp.Tests.csproj', 'ipctest/ipctest.csproj', 'SDK/Nefarius.DsHidMini.IPC/Nefarius.DsHidMini.IPC.csproj', 'build/_build.csproj', 'nuget.config', '.config/dotnet-tools.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: 'Restore local .NET tools'
        run: dotnet tool restore

      # DMF output is fully determined by the submodule commit and the runner toolchain.
      # Skip the build entirely on a cache hit (x86 never builds DMF). No restore-keys: a
      # partial match must never reuse libs built for a different commit or image.
      - name: 'Cache DMF libraries'
        if: matrix.platform != 'x86'
        id: dmf-cache
        uses: actions/cache@v6
        with:
          path: DMF/Release/${{ matrix.platform }}
          key: dmf-v1-${{ matrix.platform }}-${{ steps.cache-keys.outputs.dmf-sha }}-${{ steps.cache-keys.outputs.image-version }}

      # vcpkg validates every archive against its own ABI hash, so a partial key match is
      # safe to restore: unused or stale archives are ignored rather than reused.
      - name: 'Cache vcpkg binary archives'
        uses: actions/cache@v6
        with:
          path: vcpkg-archives
          key: vcpkg-v1-${{ matrix.platform }}-${{ hashFiles('XInputBridge/vcpkg.json') }}-${{ steps.cache-keys.outputs.vcpkg-sha }}-${{ steps.cache-keys.outputs.image-version }}
          restore-keys: |
            vcpkg-v1-${{ matrix.platform }}-

      - name: 'Configure vcpkg files binary cache'
        shell: pwsh
        run: |
          $archives = (Join-Path $env:GITHUB_WORKSPACE 'vcpkg-archives').Replace('\', '/')
          New-Item -ItemType Directory -Force -Path $archives | Out-Null
          echo "VCPKG_BINARY_SOURCES=clear;files,$archives,readwrite" >> $env:GITHUB_ENV

      - name: 'Configure vcpkg NuGet binary cache'
        if: ${{ env.VCPKG_NUGET_TOKEN != '' }}
        shell: pwsh
        run: |
          $nugetExe = & .\XInputBridge\vcpkg\vcpkg.exe fetch nuget | Select-Object -Last 1
          & $nugetExe sources add `
            -Source "https://nuget.pkg.github.com/nefarius/index.json" `
            -StorePasswordInClearText `
            -Name "GitHubPackages" `
            -UserName "nefarius" `
            -Password "$env:VCPKG_NUGET_TOKEN"
          & $nugetExe setapikey "$env:VCPKG_NUGET_TOKEN" `
            -Source "https://nuget.pkg.github.com/nefarius/index.json"
          echo "VCPKG_BINARY_SOURCES=$env:VCPKG_BINARY_SOURCES;nuget,https://nuget.pkg.github.com/nefarius/index.json,readwrite" >> $env:GITHUB_ENV

      - name: 'Stamp version into driver and XInputBridge'
        shell: cmd
        run: |
          dotnet vpatch --stamp-version "%BUILD_VERSION%" --target-file ".\driver\dshidmini.vcxproj" --vcxproj.inf-time-stamp
          dotnet vpatch --stamp-version "%BUILD_VERSION%" --target-file ".\driver\dshidmini.rc" --resource.file-version --resource.product-version
          dotnet vpatch --stamp-version "%BUILD_VERSION%" --target-file ".\XInputBridge\XInputBridge.rc" --resource.file-version --resource.product-version

      - name: 'Restore managed projects'
        # PublishControlApp and ControlApp.Tests run on x64 only. ARM64/x86 no longer
        # solution-build ControlApp, installer, or ipctest.
        if: matrix.platform == 'x64'
        shell: cmd
        run: |
          dotnet restore .\ControlApp\
          dotnet restore .\ControlApp.Tests\

      - name: 'Test ControlApp'
        if: matrix.platform == 'x64'
        shell: cmd
        run: dotnet test .\ControlApp.Tests\ControlApp.Tests.csproj --configuration Release --no-restore

      - name: 'Build'
        shell: cmd
        run: .\build.cmd ${{ matrix.platform == 'x64' && 'TestConfigParser TestReleasePipeline Compile PublishControlApp' || 'Compile' }} --target-platform ${{ matrix.platform }} ${{ steps.dmf-cache.outputs.cache-hit == 'true' && '--skip BuildDmf' || '' }}

      - name: 'Pack driver CAB'
        if: matrix.platform != 'x86'
        shell: cmd
        run: makecab.exe /f .\DsHidMini_${{ matrix.platform }}.ddf

      - name: 'Upload artifacts'
        uses: actions/upload-artifact@v7
        with:
          name: dshidmini-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            disk1/*.cab
            bin/**/dshidmini/*.inf
            bin/**/dshidmini/*.cat
            bin/**/dshidmini/*.dll
            bin/**/*.pdb
            bin/**/*.dll
            bin/*.exe

  control-app:
    name: 'Sign and mirror ControlApp and XInput'
    needs: [version, build]
    if: needs.version.outputs.is-release == 'true'
    runs-on: windows-2022
    permissions:
      contents: read
      actions: read
    env:
      SIGN_RELAY_SERVER: ${{ vars.SIGN_RELAY_SERVER }}
      SIGN_RELAY_CI_TOKEN: ${{ secrets.SIGN_RELAY_CI_TOKEN }}
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 'Require signing configuration'
        shell: pwsh
        run: |
          if (-not $env:SIGN_RELAY_SERVER) { throw 'Repository variable SIGN_RELAY_SERVER is not set.' }
          if (-not $env:SIGN_RELAY_CI_TOKEN) { throw 'Repository secret SIGN_RELAY_CI_TOKEN is not set.' }

      - name: 'Download x64 artifacts'
        uses: ./.github/actions/download-artifact-with-retry
        with:
          name: dshidmini-x64
          path: .
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Download ARM64 artifacts'
        uses: ./.github/actions/download-artifact-with-retry
        with:
          name: dshidmini-ARM64
          path: .
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Download x86 artifacts'
        uses: ./.github/actions/download-artifact-with-retry
        with:
          name: dshidmini-x86
          path: .
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Assert ControlApp is unsigned'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $file = 'bin\ControlApp.exe'
          if (-not (Test-Path -LiteralPath $file)) {
            throw "File not found: $file"
          }
          $sig = Get-AuthenticodeSignature -LiteralPath $file
          if ($sig.Status -ne 'NotSigned') {
            throw "Expected unsigned $file but Get-AuthenticodeSignature returned $($sig.Status)."
          }
          Write-Output "Unsigned as required: $file"

      - name: 'Assert XInput DLLs are unsigned'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            'bin\x64\XInput1_3.dll',
            'bin\x86\XInput1_3.dll',
            'bin\ARM64\XInput1_3.dll'
          )
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file)) {
              throw "File not found: $file"
            }
            $sig = Get-AuthenticodeSignature -LiteralPath $file
            if ($sig.Status -ne 'NotSigned') {
              throw "Expected unsigned $file but Get-AuthenticodeSignature returned $($sig.Status)."
            }
            Write-Output "Unsigned as required: $file"
          }

      - name: 'Setup .NET'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: 'Sign ControlApp'
        uses: nefarius/SignRelay@39ccbe0cef16a383237130380a5aef8db040d5d0
        with:
          server: ${{ env.SIGN_RELAY_SERVER }}
          token: ${{ env.SIGN_RELAY_CI_TOKEN }}
          in-place: true
          files: bin/ControlApp.exe

      - name: 'Sign XInput DLLs'
        uses: nefarius/SignRelay@39ccbe0cef16a383237130380a5aef8db040d5d0
        with:
          server: ${{ env.SIGN_RELAY_SERVER }}
          token: ${{ env.SIGN_RELAY_CI_TOKEN }}
          in-place: true
          skip-tool-install: true
          files: |
            bin/x64/XInput1_3.dll
            bin/x86/XInput1_3.dll
            bin/ARM64/XInput1_3.dll

      - name: 'Verify signed ControlApp'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $file = 'bin\ControlApp.exe'
          $sig = Get-AuthenticodeSignature -LiteralPath $file
          if ($sig.Status -eq 'NotSigned' -or -not $sig.SignerCertificate) {
            throw "File is not signed: $file (Status=$($sig.Status))."
          }
          if ($sig.Status -eq 'HashMismatch') {
            throw "File signature is invalid: $file (Status=$($sig.Status))."
          }
          if ($sig.Status -ne 'Valid') {
            throw "File signature is not Valid: $file (Status=$($sig.Status))."
          }
          Write-Output "Signed: $file (Status=$($sig.Status); Subject=$($sig.SignerCertificate.Subject))"

      - name: 'Verify signed XInput DLLs'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            'bin\x64\XInput1_3.dll',
            'bin\x86\XInput1_3.dll',
            'bin\ARM64\XInput1_3.dll'
          )
          foreach ($file in $files) {
            $sig = Get-AuthenticodeSignature -LiteralPath $file
            if ($sig.Status -eq 'NotSigned' -or -not $sig.SignerCertificate) {
              throw "File is not signed: $file (Status=$($sig.Status))."
            }
            if ($sig.Status -eq 'HashMismatch') {
              throw "File signature is invalid: $file (Status=$($sig.Status))."
            }
            if ($sig.Status -ne 'Valid') {
              throw "File signature is not Valid: $file (Status=$($sig.Status))."
            }
            Write-Output "Signed: $file (Status=$($sig.Status); Subject=$($sig.SignerCertificate.Subject))"
          }

      - name: 'Stage ControlApp and XInput'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'control-app-artifact'
          New-Item -ItemType Directory -Force -Path "$root\bin" | Out-Null
          Copy-Item -Path 'bin\*.exe' -Destination "$root\bin"

          $copies = @(
            @{ Src = 'bin\x64\XInput1_3.dll'; Dest = "$root\bin\x64\XInput1_3.dll" }
            @{ Src = 'bin\x86\XInput1_3.dll'; Dest = "$root\bin\x86\XInput1_3.dll" }
            @{ Src = 'bin\ARM64\XInput1_3.dll'; Dest = "$root\bin\arm64\XInput1_3.dll" }
          )
          foreach ($copy in $copies) {
            if (-not (Test-Path -LiteralPath $copy.Src)) {
              throw "File not found: $($copy.Src)"
            }
            New-Item -ItemType Directory -Force -Path (Split-Path -Parent $copy.Dest) | Out-Null
            Copy-Item -LiteralPath $copy.Src -Destination $copy.Dest
          }

          Get-ChildItem -LiteralPath $root -Recurse -File | ForEach-Object {
            Write-Output $_.FullName.Substring((Resolve-Path $root).Path.Length + 1)
          }

      - name: 'Upload ControlApp'
        uses: actions/upload-artifact@v7
        with:
          name: control-app
          if-no-files-found: error
          path: control-app-artifact

      - name: 'Mirror ControlApp'
        uses: nefarius/AppVeyorArtifactsReceiver@master
        with:
          webhook-url: ${{ secrets.WEBHOOK_URL }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          artifact-name: control-app

  partner-cab:
    name: 'Partner Portal CAB'
    needs: [version, build]
    if: needs.version.outputs.is-release == 'true'
    runs-on: windows-2022
    permissions:
      contents: read
      actions: read
    env:
      BUILD_VERSION: ${{ needs.version.outputs.driver-version }}
      SETUP_VERSION: ${{ needs.version.outputs.setup-version }}
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
      SIGN_RELAY_SERVER: ${{ vars.SIGN_RELAY_SERVER }}
      SIGN_RELAY_CI_TOKEN: ${{ secrets.SIGN_RELAY_CI_TOKEN }}
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 'Require signing configuration'
        shell: pwsh
        run: |
          if (-not $env:SIGN_RELAY_SERVER) { throw 'Repository variable SIGN_RELAY_SERVER is not set.' }
          if (-not $env:SIGN_RELAY_CI_TOKEN) { throw 'Repository secret SIGN_RELAY_CI_TOKEN is not set.' }

      - name: 'Download x64 artifacts'
        uses: ./.github/actions/download-artifact-with-retry
        with:
          name: dshidmini-x64
          path: .
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Download ARM64 artifacts'
        uses: ./.github/actions/download-artifact-with-retry
        with:
          name: dshidmini-ARM64
          path: .
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Assert driver DLLs are unsigned'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            'bin\x64\dshidmini\dshidmini.dll',
            'bin\ARM64\dshidmini\dshidmini.dll'
          )
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file)) {
              throw "File not found: $file"
            }
            $sig = Get-AuthenticodeSignature -LiteralPath $file
            if ($sig.Status -ne 'NotSigned') {
              throw "Expected unsigned $file but Get-AuthenticodeSignature returned $($sig.Status)."
            }
            Write-Output "Unsigned as required: $file"
          }

      - name: 'Setup .NET'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: 'Sign driver DLLs'
        uses: nefarius/SignRelay@39ccbe0cef16a383237130380a5aef8db040d5d0
        with:
          server: ${{ env.SIGN_RELAY_SERVER }}
          token: ${{ env.SIGN_RELAY_CI_TOKEN }}
          in-place: true
          files: |
            bin/x64/dshidmini/dshidmini.dll
            bin/ARM64/dshidmini/dshidmini.dll

      - name: 'Verify signed driver DLLs'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            'bin\x64\dshidmini\dshidmini.dll',
            'bin\ARM64\dshidmini\dshidmini.dll'
          )
          foreach ($file in $files) {
            $sig = Get-AuthenticodeSignature -LiteralPath $file
            if ($sig.Status -eq 'NotSigned' -or -not $sig.SignerCertificate) {
              throw "File is not signed: $file (Status=$($sig.Status))."
            }
            if ($sig.Status -eq 'HashMismatch') {
              throw "File signature is invalid: $file (Status=$($sig.Status))."
            }
            if ($sig.Status -ne 'Valid') {
              throw "File signature is not Valid: $file (Status=$($sig.Status))."
            }
            Write-Output "Signed: $file (Status=$($sig.Status); Subject=$($sig.SignerCertificate.Subject))"
          }

      - name: 'Pack combined driver CAB'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path bin\partner | Out-Null
          & .\build\New-PartnerSubmissionInf.ps1 -InputInf bin\x64\dshidmini\dshidmini.inf -OutputInf bin\partner\dshidmini.inf
          & makecab.exe /f .\DsHidMini_combined.ddf
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $cabName = "dshidmini_$env:BUILD_VERSION.cab"
          Rename-Item -LiteralPath 'disk1\dshidmini.cab' -NewName $cabName
          echo "PARTNER_CAB=disk1\$cabName" >> $env:GITHUB_ENV
          Write-Output "Created disk1\$cabName"

      - name: 'Sign partner CAB'
        uses: nefarius/SignRelay@39ccbe0cef16a383237130380a5aef8db040d5d0
        with:
          server: ${{ env.SIGN_RELAY_SERVER }}
          token: ${{ env.SIGN_RELAY_CI_TOKEN }}
          in-place: true
          skip-tool-install: true
          files: ${{ env.PARTNER_CAB }}

      - name: 'Verify signed partner CAB'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cab = $env:PARTNER_CAB
          $sig = Get-AuthenticodeSignature -LiteralPath $cab
          if ($sig.Status -eq 'NotSigned' -or -not $sig.SignerCertificate) {
            throw "Partner CAB is not signed: $cab (Status=$($sig.Status))."
          }
          if ($sig.Status -eq 'HashMismatch') {
            throw "Partner CAB signature is invalid: $cab (Status=$($sig.Status))."
          }
          if ($sig.Status -ne 'Valid') {
            throw "Partner CAB signature is not Valid: $cab (Status=$($sig.Status))."
          }
          Write-Output "Signed: $cab (Status=$($sig.Status); Subject=$($sig.SignerCertificate.Subject))"

      - name: 'Write release metadata'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cab = $env:PARTNER_CAB
          $sha = (Get-FileHash -LiteralPath $cab -Algorithm SHA256).Hash.ToLowerInvariant()
          $metadata = [ordered]@{
            schemaVersion = 1
            tag = $env:RELEASE_TAG
            setupVersion = $env:SETUP_VERSION
            driverVersion = $env:BUILD_VERSION
            commit = '${{ github.sha }}'
            runId = [int64]'${{ github.run_id }}'
            repository = '${{ github.repository }}'
            publisherSubject = 'Nefarius Software Solutions e.U.'
            artifacts = [ordered]@{
              partnerSubmission = 'dshidmini-partner-submission'
              controlApp = 'control-app'
              platforms = @('dshidmini-x64', 'dshidmini-ARM64', 'dshidmini-x86')
              metadata = 'release-metadata'
            }
            files = [ordered]@{
              partnerCab = [ordered]@{
                name = [IO.Path]::GetFileName($cab)
                sha256 = $sha
              }
            }
          }
          $json = $metadata | ConvertTo-Json -Depth 6
          $out = 'release-metadata.json'
          [IO.File]::WriteAllText((Join-Path $pwd $out), $json, [Text.UTF8Encoding]::new($false))
          echo "RELEASE_METADATA=$out" >> $env:GITHUB_ENV
          Write-Output $json

      - name: 'Upload partner submission CAB'
        uses: actions/upload-artifact@v7
        with:
          name: dshidmini-partner-submission
          if-no-files-found: error
          path: ${{ env.PARTNER_CAB }}

      - name: 'Upload release metadata'
        uses: actions/upload-artifact@v7
        with:
          name: release-metadata
          if-no-files-found: error
          path: ${{ env.RELEASE_METADATA }}

      - name: 'Mirror partner submission CAB'
        uses: nefarius/AppVeyorArtifactsReceiver@master
        with:
          webhook-url: ${{ secrets.WEBHOOK_URL }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          artifact-name: dshidmini-partner-submission

  partner-signing:
    name: 'Partner Center signing'
    needs: [version, partner-cab]
    if: needs.version.outputs.is-release == 'true'
    permissions:
      contents: read
      actions: read
    secrets: inherit
    uses: ./.github/workflows/partner-signing.yml
    with:
      source-run-id: ${{ github.run_id }}
