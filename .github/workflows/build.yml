name: 'Build'

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
    paths-ignore:
      - '**/*.md'
      - '**/*.aip'
      - '.vscode/**'
      - '**/*.json'
      - 'setup/**'
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  # Offset chosen to stay well above the last AppVeyor build counter (3.3.1251.0) at time of migration.
  BUILD_VERSION_OFFSET: 2000
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_NOLOGO: 'true'
  SCPLIB_ENABLE_TELEMETRY: 'false'
  # Disabled by default; enabled per-job below only when the VCPKG_NUGET_TOKEN secret is present.
  # GITHUB_TOKEN cannot push new packages under a personal-account GitHub Packages namespace, so a
  # PAT with read:packages/write:packages is required. See:
  # https://github.com/microsoft/vcpkg/issues/47470
  VCPKG_BINARY_SOURCES: 'clear'

jobs:
  build:
    name: 'Platform: ${{ matrix.platform }}'
    runs-on: windows-2022
    permissions:
      contents: read
    env:
      # Secrets can't be referenced directly in `if:` conditions, only in `env:`/`with:`,
      # so promote it here and check env.VCPKG_NUGET_TOKEN in the step below instead.
      VCPKG_NUGET_TOKEN: ${{ secrets.VCPKG_NUGET_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64, x86]
    outputs:
      build-version: ${{ steps.version.outputs.build-version }}
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true
          persist-credentials: false

      - name: 'Compute build version'
        id: version
        shell: pwsh
        run: |
          $buildVersion = "3.3.$([int]$env:BUILD_VERSION_OFFSET + ${{ github.run_number }}).0"
          echo "BUILD_VERSION=$buildVersion" >> $env:GITHUB_ENV
          echo "build-version=$buildVersion" >> $env:GITHUB_OUTPUT
          Write-Output "Building version $buildVersion"

      - name: 'Bootstrap vcpkg'
        shell: cmd
        run: .\XInputBridge\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: 'Configure vcpkg NuGet binary cache'
        if: ${{ env.VCPKG_NUGET_TOKEN != '' }}
        shell: pwsh
        run: |
          $nugetExe = & .\XInputBridge\vcpkg\vcpkg.exe fetch nuget | Select-Object -Last 1
          & $nugetExe sources add `
            -Source "https://nuget.pkg.github.com/nefarius/index.json" `
            -StorePasswordInClearText `
            -Name "GitHubPackages" `
            -UserName "nefarius" `
            -Password "$env:VCPKG_NUGET_TOKEN"
          & $nugetExe setapikey "$env:VCPKG_NUGET_TOKEN" `
            -Source "https://nuget.pkg.github.com/nefarius/index.json"
          echo "VCPKG_BINARY_SOURCES=clear;nuget,https://nuget.pkg.github.com/nefarius/index.json,readwrite" >> $env:GITHUB_ENV

      - name: 'Cache NuGet packages'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'nuget.config') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: 'Install vpatch'
        run: dotnet tool install --global Nefarius.Tools.Vpatch

      - name: 'Stamp version into driver and XInputBridge'
        shell: cmd
        run: |
          vpatch --stamp-version "%BUILD_VERSION%" --target-file ".\driver\dshidmini.vcxproj" --vcxproj.inf-time-stamp
          vpatch --stamp-version "%BUILD_VERSION%" --target-file ".\driver\dshidmini.rc" --resource.file-version --resource.product-version
          vpatch --stamp-version "%BUILD_VERSION%" --target-file ".\XInputBridge\XInputBridge.rc" --resource.file-version --resource.product-version

      - name: 'Restore managed projects'
        # msbuild's /t:Rebuild over the whole solution does not implicitly restore SDK-style
        # projects; these two dotnet restore calls also transitively restore the SDK project
        # referenced by both. Mirrors appveyor.yml's former before_build steps.
        shell: cmd
        run: |
          dotnet restore .\ControlApp\
          dotnet restore .\ipctest\

      # DMF output is fully determined by the submodule commit and the runner toolchain.
      # Skip the build entirely on a cache hit (x86 never builds DMF). No restore-keys: a
      # partial match must never reuse libs built for a different commit or image.
      - name: 'Resolve DMF submodule commit'
        if: matrix.platform != 'x86'
        id: dmf-sha
        shell: pwsh
        run: |
          # ImageVersion is a runner process env var, not an Actions `env:` context value,
          # so capture it here for the cache key (invalidates on toolchain image upgrades).
          $sha = git rev-parse HEAD:DMF
          $imageVersion = $env:ImageVersion
          echo "sha=$sha" >> $env:GITHUB_OUTPUT
          echo "image-version=$imageVersion" >> $env:GITHUB_OUTPUT
          Write-Output "DMF submodule commit $sha (ImageVersion=$imageVersion)"

      - name: 'Cache DMF libraries'
        if: matrix.platform != 'x86'
        id: dmf-cache
        uses: actions/cache@v4
        with:
          path: DMF/Release/${{ matrix.platform }}
          key: dmf-v1-${{ matrix.platform }}-${{ steps.dmf-sha.outputs.sha }}-${{ steps.dmf-sha.outputs.image-version }}

      - name: 'Build'
        shell: cmd
        run: .\build.cmd --target-platform ${{ matrix.platform }} ${{ steps.dmf-cache.outputs.cache-hit == 'true' && '--skip BuildDmf' || '' }}

      - name: 'Publish ControlApp'
        if: matrix.platform == 'x64'
        shell: cmd
        run: .\build.cmd PublishControlApp --skip Compile

      - name: 'Pack driver CAB'
        if: matrix.platform != 'x86'
        shell: cmd
        run: makecab.exe /f .\DsHidMini_${{ matrix.platform }}.ddf

      - name: 'Upload artifacts'
        uses: actions/upload-artifact@v4
        with:
          name: dshidmini-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            disk1/*.cab
            bin/**/dshidmini/*.inf
            bin/**/dshidmini/*.cat
            bin/**/dshidmini/*.dll
            bin/**/*.pdb
            bin/**/*.dll
            bin/*.exe

  partner-cab:
    name: 'Partner Portal CAB'
    needs: build
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    permissions:
      contents: read
      actions: read
    env:
      BUILD_VERSION: ${{ needs.build.outputs.build-version }}
      SIGN_RELAY_SERVER: ${{ vars.SIGN_RELAY_SERVER }}
      SIGN_RELAY_CI_TOKEN: ${{ secrets.SIGN_RELAY_CI_TOKEN }}
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 'Require signing configuration'
        shell: pwsh
        run: |
          if (-not $env:SIGN_RELAY_SERVER) { throw 'Repository variable SIGN_RELAY_SERVER is not set.' }
          if (-not $env:SIGN_RELAY_CI_TOKEN) { throw 'Repository secret SIGN_RELAY_CI_TOKEN is not set.' }

      - name: 'Download x64 artifacts'
        uses: actions/download-artifact@v4
        with:
          name: dshidmini-x64
          path: .

      - name: 'Download ARM64 artifacts'
        uses: actions/download-artifact@v4
        with:
          name: dshidmini-ARM64
          path: .

      - name: 'Assert driver DLLs are unsigned'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dlls = @(
            'bin\x64\dshidmini\dshidmini.dll',
            'bin\ARM64\dshidmini\dshidmini.dll'
          )
          foreach ($dll in $dlls) {
            if (-not (Test-Path -LiteralPath $dll)) {
              throw "Driver DLL not found: $dll"
            }
            $sig = Get-AuthenticodeSignature -LiteralPath $dll
            if ($sig.Status -ne 'NotSigned') {
              throw "Expected unsigned $dll but Get-AuthenticodeSignature returned $($sig.Status)."
            }
            Write-Output "Unsigned as required: $dll"
          }

      - name: 'Setup .NET'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 'Sign driver DLLs'
        uses: nefarius/SignRelay@master
        with:
          server: ${{ env.SIGN_RELAY_SERVER }}
          token: ${{ env.SIGN_RELAY_CI_TOKEN }}
          in-place: true
          files: |
            bin/x64/dshidmini/dshidmini.dll
            bin/ARM64/dshidmini/dshidmini.dll

      - name: 'Verify signed driver DLLs'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dlls = @(
            'bin\x64\dshidmini\dshidmini.dll',
            'bin\ARM64\dshidmini\dshidmini.dll'
          )
          foreach ($dll in $dlls) {
            $sig = Get-AuthenticodeSignature -LiteralPath $dll
            if ($sig.Status -eq 'NotSigned' -or -not $sig.SignerCertificate) {
              throw "Driver DLL is not signed: $dll (Status=$($sig.Status))."
            }
            if ($sig.Status -eq 'HashMismatch') {
              throw "Driver DLL signature is invalid: $dll (Status=$($sig.Status))."
            }
            if ($sig.Status -ne 'Valid') {
              throw "Driver DLL signature is not Valid: $dll (Status=$($sig.Status))."
            }
            Write-Output "Signed: $dll (Status=$($sig.Status); Subject=$($sig.SignerCertificate.Subject))"
          }

      - name: 'Pack combined driver CAB'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & makecab.exe /f .\DsHidMini_combined.ddf
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $cabName = "dshidmini_$env:BUILD_VERSION.cab"
          Rename-Item -LiteralPath 'disk1\dshidmini.cab' -NewName $cabName
          echo "PARTNER_CAB=disk1\$cabName" >> $env:GITHUB_ENV
          Write-Output "Created disk1\$cabName"

      - name: 'Sign partner CAB'
        uses: nefarius/SignRelay@v1.0.0-pre010
        with:
          server: ${{ env.SIGN_RELAY_SERVER }}
          token: ${{ env.SIGN_RELAY_CI_TOKEN }}
          in-place: true
          skip-tool-install: true
          files: ${{ env.PARTNER_CAB }}

      - name: 'Verify signed partner CAB'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cab = $env:PARTNER_CAB
          $sig = Get-AuthenticodeSignature -LiteralPath $cab
          if ($sig.Status -eq 'NotSigned' -or -not $sig.SignerCertificate) {
            throw "Partner CAB is not signed: $cab (Status=$($sig.Status))."
          }
          if ($sig.Status -eq 'HashMismatch') {
            throw "Partner CAB signature is invalid: $cab (Status=$($sig.Status))."
          }
          if ($sig.Status -ne 'Valid') {
            throw "Partner CAB signature is not Valid: $cab (Status=$($sig.Status))."
          }
          Write-Output "Signed: $cab (Status=$($sig.Status); Subject=$($sig.SignerCertificate.Subject))"

      - name: 'Upload partner submission CAB'
        uses: actions/upload-artifact@v4
        with:
          name: dshidmini-partner-submission
          if-no-files-found: error
          path: ${{ env.PARTNER_CAB }}

      - name: 'Mirror partner submission CAB'
        uses: nefarius/AppVeyorArtifactsReceiver@master
        with:
          webhook-url: ${{ secrets.WEBHOOK_URL }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          artifact-name: dshidmini-partner-submission

  release:
    name: 'Draft release'
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 'Download artifacts'
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: dshidmini-*

      - name: 'Create draft release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$REF_NAME" \
            --repo "${{ github.repository }}" \
            --title "$REF_NAME (build ${{ needs.build.outputs.build-version }})" \
            --draft \
            --generate-notes \
            artifacts/dshidmini-x64/disk1/*.cab \
            artifacts/dshidmini-ARM64/disk1/*.cab \
            artifacts/dshidmini-x64/bin/*.exe
