name: 'Publish SDK to NuGet'

on:
  push:
    tags: ['sdk-v*']
  pull_request:
    branches: [master]
    paths:
      - 'SDK/**'
      - 'Directory.Build.props'
      - '.github/workflows/publish-to-nuget.yml'
  workflow_dispatch:

concurrency:
  group: nuget-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_NOLOGO: 'true'

jobs:
  pack:
    name: 'Pack Nefarius.DsHidMini.IPC'
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: 'Checkout'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 'Setup .NET'
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: 'Modify README.md for NuGet'
        shell: bash
        run: |
          sed -i 's/# <img[^>]*>/# /' SDK/Nefarius.DsHidMini.IPC/README.md

      - name: 'Pack'
        run: dotnet pack SDK/Nefarius.DsHidMini.IPC -c Release -o artifacts

      - name: 'Upload package'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-package
          if-no-files-found: error
          path: artifacts/*

  publish:
    name: 'Publish to nuget.org'
    needs: pack
    if: startsWith(github.ref, 'refs/tags/sdk-v')
    runs-on: windows-2022
    permissions:
      contents: read
      id-token: write
    steps:
      - name: 'Download package'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nuget-package
          path: artifacts

      - name: 'Setup .NET'
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: 'NuGet login (OIDC to short-lived key)'
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: Nefarius

      - name: 'Push package'
        shell: pwsh
        run: |
          $packages = Get-ChildItem -LiteralPath artifacts -Filter *.nupkg -File
          if (-not $packages) {
            throw 'No .nupkg files found under artifacts/.'
          }
          foreach ($package in $packages) {
            dotnet nuget push $package.FullName `
              --api-key ${{ steps.login.outputs.NUGET_API_KEY }} `
              --source https://api.nuget.org/v3/index.json `
              --skip-duplicate
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
